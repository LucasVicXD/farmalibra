<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Unity WebGL Player | Vlibras</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #gameContainer {
        width: 100vw;
        height: 100vh;
        background-color: transparent !important;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>

    <script src="./unity-loader.js"></script>
    <script>
      ['log', 'warn', 'error', 'info'].forEach((e) => {
        const t = console[e];
        console[e] = (...args) => {
          if ((Error().stack || '').indexOf('/unity/') === -1) {
            t.apply(console, args);
          }
        };
      });

      const postEvent = (e, t) => {
        if (window.parent) {
          window.parent.postMessage({ type: 'unity_event', event: e, data: t }, '*');
        }
      };

      // =====================================================================
      // CACHE PERSISTENTE EM INDEXEDDB (SALVA A API DESCOMPACTADA NO APARELHO)
      // Quando aberto via servidor/PWA (http/https), salva os arquivos do
      // VLibras já descompactados no IndexedDB na 1ª vez para carregar
      // instantaneamente nas próximas vezes sem baixar novamente.
      // =====================================================================
      const DB_NAME = 'FarmaLibrasVLibrasEngine_v2';
      const STORE_NAME = 'assets';
      let dbInstancePromise = null;

      function getDB() {
        if (dbInstancePromise) return dbInstancePromise;
        dbInstancePromise = new Promise((resolve) => {
          try {
            if (!window.indexedDB || location.protocol === 'file:') {
              resolve(null);
              return;
            }
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (ev) => {
              const db = ev.target.result;
              if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
        return dbInstancePromise;
      }

      async function readFromCache(url) {
        const db = await getDB();
        if (!db) return null;
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(url);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
      }

      async function writeToCache(url, uint8Arr) {
        const db = await getDB();
        if (!db || !uint8Arr) return;
        return new Promise((resolve) => {
          try {
            const bufferCopy = uint8Arr.slice().buffer;
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(bufferCopy, url);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch {
            resolve(false);
          }
        });
      }

      if (typeof UnityLoader !== 'undefined') {
        const originalDownloadJob = UnityLoader.downloadJob;
        UnityLoader.downloadJob = function (e, t) {
          const url = t.parameters.url;
          readFromCache(url)
            .then((cachedBuffer) => {
              if (cachedBuffer && cachedBuffer.byteLength > 0) {
                const decompressed = new Uint8Array(cachedBuffer);
                if (t.parameters.onprogress) {
                  t.parameters.onprogress({
                    loaded: decompressed.byteLength,
                    total: decompressed.byteLength,
                    lengthComputable: true
                  });
                }
                if (t.parameters.onload) {
                  t.parameters.onload({
                    loaded: decompressed.byteLength,
                    total: decompressed.byteLength,
                    lengthComputable: true
                  });
                }
                t.complete(decompressed);
                return;
              }

              // Se ainda não está no IndexedDB, baixa normalmente, descompacta e salva
              const xhr = new XMLHttpRequest();
              xhr.open('GET', url, true);
              xhr.responseType = 'arraybuffer';
              if (t.parameters.onprogress) {
                xhr.addEventListener('progress', t.parameters.onprogress);
              }
              if (t.parameters.onload) {
                xhr.addEventListener('load', t.parameters.onload);
              }
              xhr.onload = function () {
                if (xhr.status >= 200 && xhr.status < 300 && xhr.response) {
                  UnityLoader.Compression.decompress(
                    new Uint8Array(xhr.response),
                    function (decompressed) {
                      writeToCache(url, decompressed).finally(() => {
                        t.complete(decompressed);
                      });
                    }
                  );
                } else {
                  originalDownloadJob.call(UnityLoader, e, t);
                }
              };
              xhr.onerror = function () {
                originalDownloadJob.call(UnityLoader, e, t);
              };
              xhr.send();
            })
            .catch(() => {
              originalDownloadJob.call(UnityLoader, e, t);
            });
        };
      }

      let gameInstance = UnityLoader.instantiate(
        'gameContainer',
        'https://vlibras.gov.br/app/unity/playerweb.json?v=7.12.2',
        {
          onProgress: (e, n) => {
            postEvent('update_progress', n);
          },
          compatibilityCheck: (e, n, r) => {
            if (UnityLoader.SystemInfo.hasWebGL) {
              n();
            } else {
              postEvent('on_error', 'unsupported');
              r();
            }
          }
        }
      );

      window.addEventListener('message', (t) => {
        if (!gameInstance) return;
        const n = t.data;
        if (!n) return;
        if (n.type === 'get_unity_instance') return gameInstance;
        if (n.type === 'unity') {
          gameInstance.SendMessage(n.object, n.method, n.params);
        }
      });

      window.getUnityInstance = () => gameInstance;
      window.onPlayingStateChange = (...e) => postEvent('on_playing_state_change', e);
      window.CounterGloss = (...e) => postEvent('counter_gloss', e);
      window.onLoadPlayer = () => postEvent('on_load_player');
      window.GetAvatar = (e) => postEvent('get_avatar', e);
      window.FinishWelcome = (e) => postEvent('finish_welcome', e);
      window.SetFullscreen = (t) => gameInstance.SetFullscreen(t);
    </script>
  </body>
</html>
