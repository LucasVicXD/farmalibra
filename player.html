<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Unity WebGL Player | Vlibras</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #gameContainer {
        width: 100vw;
        height: 100vh;
        background-color: transparent !important;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>

    <script src="./unity-loader.js"></script>
    <script>
      ['log', 'warn', 'error', 'info'].forEach((e) => {
        const t = console[e];
        console[e] = (...args) => {
          if ((Error().stack || '').indexOf('/unity/') === -1) {
            t.apply(console, args);
          }
        };
      });

      const postEvent = (e, t) => {
        if (window.parent) {
          window.parent.postMessage({ type: 'unity_event', event: e, data: t }, '*');
        }
      };

      // =====================================================================
      // OTIMIZAÇÃO 1: RESPOSTA INSTANTÂNEA (0ms) PARA O PLAYERWEB.JSON
      // Evita que cada um dos 4 bonequinhos espere 2 a 4 segundos pela rede
      // apenas para baixar o JSON de configuração de 380 bytes.
      // =====================================================================
      const PLAYERWEB_JSON_STR = JSON.stringify({
        companyName: 'Vlibras',
        productName: 'Vlibras',
        dataUrl: 'playerweb.data.unityweb?v=7.12.2',
        wasmCodeUrl: 'playerweb.wasm.code.unityweb?v=7.12.2',
        wasmFrameworkUrl: 'playerweb.wasm.framework.unityweb?v=7.12.2',
        TOTAL_MEMORY: 268435456,
        graphicsAPI: ['WebGL 1.0'],
        webglContextAttributes: { preserveDrawingBuffer: false },
        splashScreenStyle: 'Light',
        backgroundColor: '#FFFFFF',
        cacheControl: { default: 'must-revalidate' }
      });

      const origXhrOpen = XMLHttpRequest.prototype.open;
      const origXhrSend = XMLHttpRequest.prototype.send;

      XMLHttpRequest.prototype.open = function (method, url, ...rest) {
        this.__interceptPlayerJson = typeof url === 'string' && url.indexOf('playerweb.json') !== -1;
        return origXhrOpen.call(this, method, url, ...rest);
      };

      XMLHttpRequest.prototype.send = function (body) {
        if (this.__interceptPlayerJson) {
          Object.defineProperty(this, 'status', { get: () => 200 });
          Object.defineProperty(this, 'readyState', { get: () => 4 });
          Object.defineProperty(this, 'responseText', { get: () => PLAYERWEB_JSON_STR });
          Object.defineProperty(this, 'response', { get: () => PLAYERWEB_JSON_STR });
          setTimeout(() => {
            if (typeof this.onload === 'function') this.onload();
          }, 0);
          return;
        }
        return origXhrSend.call(this, body);
      };

      // =====================================================================
      // OTIMIZAÇÃO 2: COMPARTILHAMENTO DE MEMÓRIA RAM + MÓDULO WEBASSEMBLY
      // ENTRE OS 4 BONEQUINHOS E CACHE PERSISTENTE EM INDEXEDDB
      // - Lê do IndexedDB apenas 1 única vez (os demais leem da RAM em 0ms)
      // - Compila o WebAssembly (25 MB) apenas 1 única vez e reutiliza nos 4
      // =====================================================================
      function getSharedRoot() {
        try {
          if (window.parent && window.parent.location.origin === window.location.origin) {
            return window.parent;
          }
        } catch {}
        return window;
      }

      const sharedRoot = getSharedRoot();
      const DB_NAME = 'FarmaLibrasVLibrasEngine_v2';
      const STORE_NAME = 'assets';

      function getDB() {
        if (sharedRoot.__vlibrasDBPromise) return sharedRoot.__vlibrasDBPromise;
        sharedRoot.__vlibrasDBPromise = new Promise((resolve) => {
          try {
            if (!window.indexedDB || location.protocol === 'file:') {
              resolve(null);
              return;
            }
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (ev) => {
              const db = ev.target.result;
              if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
        return sharedRoot.__vlibrasDBPromise;
      }

      async function readFromCache(url) {
        const db = await getDB();
        if (!db) return null;
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(url);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
      }

      async function writeToCache(url, uint8Arr) {
        const db = await getDB();
        if (!db || !uint8Arr) return;
        return new Promise((resolve) => {
          try {
            const bufferCopy = uint8Arr.slice().buffer;
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(bufferCopy, url);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch {
            resolve(false);
          }
        });
      }

      // Compila o binário WebAssembly (25 MB) apenas 1 vez na janela principal
      // e instancia instantaneamente nos 4 bonequinhos
      if (typeof WebAssembly !== 'undefined' && WebAssembly.instantiate) {
        const origWasmInstantiate = WebAssembly.instantiate.bind(WebAssembly);
        WebAssembly.instantiate = function (source, importObject) {
          const isLargeBuffer =
            source &&
            (source instanceof Uint8Array ||
              source instanceof ArrayBuffer ||
              ArrayBuffer.isView(source)) &&
            source.byteLength > 1000000;

          if (isLargeBuffer) {
            try {
              if (!sharedRoot.__vlibrasWasmModulePromise) {
                sharedRoot.__vlibrasWasmModulePromise = WebAssembly.compile(source).catch((err) => {
                  delete sharedRoot.__vlibrasWasmModulePromise;
                  throw err;
                });
              }
              return sharedRoot.__vlibrasWasmModulePromise.then((compiledModule) =>
                origWasmInstantiate(compiledModule, importObject).then((instance) => ({
                  instance: instance,
                  module: compiledModule
                }))
              );
            } catch {}
          }
          return origWasmInstantiate(source, importObject);
        };
      }

      if (typeof UnityLoader !== 'undefined') {
        // Evita recalcular hash MD5 em JS sobre 500 KB a cada iframe
        UnityLoader.loadCode = function (e, t, n) {
          const r = 'vlibras_fw_' + Math.random().toString(36).slice(2, 10);
          const o = document.createElement('script');
          const i = URL.createObjectURL(
            new Blob(['UnityLoader["' + r + '"]=', e], { type: 'text/javascript' })
          );
          UnityLoader.Blobs[i] = n;
          o.src = i;
          o.onload = function () {
            URL.revokeObjectURL(i);
            t(r);
            delete o.onload;
          };
          document.body.appendChild(o);
        };

        const originalDownloadJob = UnityLoader.downloadJob;
        UnityLoader.downloadJob = function (e, t) {
          const url = t.parameters.url;
          if (!sharedRoot.__vlibrasRamAssets) {
            sharedRoot.__vlibrasRamAssets = {};
          }

          if (!sharedRoot.__vlibrasRamAssets[url]) {
            sharedRoot.__vlibrasRamAssets[url] = (async () => {
              const cachedBuffer = await readFromCache(url);
              if (cachedBuffer && cachedBuffer.byteLength > 0) {
                return new Uint8Array(cachedBuffer);
              }
              return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.responseType = 'arraybuffer';
                if (t.parameters.onprogress) {
                  xhr.addEventListener('progress', t.parameters.onprogress);
                }
                xhr.onload = function () {
                  if (xhr.status >= 200 && xhr.status < 300 && xhr.response) {
                    UnityLoader.Compression.decompress(
                      new Uint8Array(xhr.response),
                      function (decompressed) {
                        writeToCache(url, decompressed).finally(() => {
                          resolve(decompressed);
                        });
                      }
                    );
                  } else {
                    reject(new Error('HTTP ' + xhr.status));
                  }
                };
                xhr.onerror = () => reject(new Error('Network error'));
                xhr.send();
              });
            })().catch((err) => {
              delete sharedRoot.__vlibrasRamAssets[url];
              throw err;
            });
          }

          sharedRoot.__vlibrasRamAssets[url]
            .then((decompressed) => {
              if (t.parameters.onprogress) {
                t.parameters.onprogress({
                  loaded: decompressed.byteLength,
                  total: decompressed.byteLength,
                  lengthComputable: true
                });
              }
              if (t.parameters.onload) {
                t.parameters.onload({
                  loaded: decompressed.byteLength,
                  total: decompressed.byteLength,
                  lengthComputable: true
                });
              }
              t.complete(decompressed);
            })
            .catch(() => {
              originalDownloadJob.call(UnityLoader, e, t);
            });
        };
      }

      let gameInstance = UnityLoader.instantiate(
        'gameContainer',
        'https://vlibras.gov.br/app/unity/playerweb.json?v=7.12.2',
        {
          onProgress: (e, n) => {
            postEvent('update_progress', n);
          },
          compatibilityCheck: (e, n, r) => {
            if (UnityLoader.SystemInfo.hasWebGL) {
              n();
            } else {
              postEvent('on_error', 'unsupported');
              r();
            }
          }
        }
      );

      window.addEventListener('message', (t) => {
        if (!gameInstance) return;
        const n = t.data;
        if (!n) return;
        if (n.type === 'get_unity_instance') return gameInstance;
        if (n.type === 'unity') {
          gameInstance.SendMessage(n.object, n.method, n.params);
        }
      });

      window.getUnityInstance = () => gameInstance;
      window.onPlayingStateChange = (...e) => postEvent('on_playing_state_change', e);
      window.CounterGloss = (...e) => postEvent('counter_gloss', e);
      window.onLoadPlayer = () => postEvent('on_load_player');
      window.GetAvatar = (e) => postEvent('get_avatar', e);
      window.FinishWelcome = (e) => postEvent('finish_welcome', e);
      window.SetFullscreen = (t) => gameInstance.SetFullscreen(t);
    </script>
  </body>
</html>
